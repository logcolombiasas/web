name: Deploy Web & Infra to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd infra && pnpm install --frozen-lockfile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build React App
        run: pnpm build

      # 🔍 PASO DE DEPURACIÓN: Veamos qué carpetas existen realmente
      - name: Debug Output Directory
        run: |
          echo "=== Directorio actual ==="
          pwd
          echo "=== Contenido de la raíz ==="
          ls -la
          echo "=== Contenido de dist (si existe) ==="
          ls -la dist/ || echo "🚨 LA CARPETA DIST NO SE CREÓ 🚨"

      - name: Deploy Infrastructure and Assets (CDK)
        run: |
          cd infra
          pnpm cdk deploy --require-approval never